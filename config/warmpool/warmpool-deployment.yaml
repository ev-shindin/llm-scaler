apiVersion: apps/v1
kind: Deployment
metadata:
  name: wva-warm-pool
  labels:
    app.kubernetes.io/name: workload-variant-autoscaler
    app.kubernetes.io/component: warm-pool
    # The pool's NAME. A namespace may hold more than one: a warm copy is only
    # reusable on the GPU it was loaded on, so a cluster with two accelerator
    # types needs a pool per type, and a tensor-parallel variant needs Pods
    # holding that many devices. Copy this Deployment, change this label and the
    # matching one in the template below, and that is a second pool.
    #
    # Models select a pool by name; a namespace with only one needs no selection
    # at all.
    llm-d.ai/warm-pool: default
spec:
  # K: how many models the pool can have AWAKE at once, one per Pod. Start at 1
  # and size it from measurement -- the loss model in
  # docs/proposals/fast-model-loading.md turns spike rate and hold time into K,
  # and neither has been measured on a fleet with organic traffic.
  #
  # A STARTING size only. Once the pool's ScaledObject exists, KEDA owns this
  # field -- what decides whether the pool can warm anything is
  # maxReplicaCount there against warmPoolSleepMinSize, not this number.
  replicas: 2
  # Recreate, not RollingUpdate: a surge needs a SECOND GPU before the old Pod
  # releases its own, so on a node with one free GPU the default strategy
  # deadlocks -- the new Pod Pending, the old one never terminated.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: workload-variant-autoscaler
      app.kubernetes.io/component: warm-pool
      # The pool NAME is part of the selector, not decoration. Without it a
      # second pool copied from this file selects the same Pods as the first --
      # two Deployments fighting over one set, which Kubernetes warns about and
      # which makes replica accounting meaningless. Change it in all three
      # places when you copy this: the label above, here, and the template.
      llm-d.ai/warm-pool: default
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workload-variant-autoscaler
        app.kubernetes.io/component: warm-pool
        # Which pool this Pod belongs to. Must match the Deployment's label
        # above: WVA groups Pods by THIS one, and a Pod whose value matches no
        # declared pool holds a GPU no pool will ever lend -- which WVA reports
        # rather than folding it into the first pool it finds.
        llm-d.ai/warm-pool: default
        # Membership in a model's InferencePool is added and removed by WVA at
        # wake and sleep. Nothing here claims a model: an idle pool Pod belongs
        # to no InferencePool and receives no traffic.
    spec:
      # Nothing in this Pod talks to the Kubernetes API. The supervisor's only
      # API use is a ConfigMap read reached exclusively in --mock-gpus mode
      # (gputranslator.py: `if self.mock_mode and ...`), which this Pod never
      # enables -- so it needs no token, and the container that runs model code
      # should not be handed one.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Spread across nodes, by preference rather than by requirement.
      #
      # The pool is insurance, and insurance concentrated on one node is not
      # insurance: losing that node loses every warm model at once, and the
      # first spike afterwards pays a full cold start for each. Preferred and
      # not required, because a pool larger than the cluster's GPU node count
      # must still schedule -- a Pod that will not start is worse than one
      # sharing a node.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: workload-variant-autoscaler
                    app.kubernetes.io/component: warm-pool
      # GPU nodes are routinely tainted. Without this the Deployment sits
      # Pending on exactly the clusters it is meant for.
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      # CLUSTER-SPECIFIC. Needed where the GPU operator installs a RuntimeClass
      # (pokprod uses `nvidia-legacy`); on a cluster without it, admission fails
      # outright, so remove this line rather than guess at a name.
      runtimeClassName: nvidia-legacy
      containers:
        - name: inference-server
          # The launcher published by Fast Model Actuation: it spawns and
          # supervises vLLM engines inside this container. Copied into
          # warmpool/supervisor/ so the source is readable here; the image is
          # theirs because it is the one proven on this cluster.
          image: ghcr.io/llm-d-incubation/llm-d-fast-model-actuation/launcher:v0.6.0-alpha.13
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              exec python3 /app/launcher.py \
              --host 0.0.0.0 \
              --log-level info \
              --port=8001
          ports:
            - name: supervisor
              containerPort: 8001
              protocol: TCP
          env:
            # Every cache under the shared PVC, so a model loaded once is loaded
            # for every Pod: measured on this cluster, a 1.5 GB weight read takes
            # ~2.8 s whether or not this node has served the model before, and
            # the shared torch.compile cache cuts compilation from 12.35 s to
            # 3.08 s.
            #
            # KNOWN RISK, kept deliberately for that measurement: the inductor
            # and Triton caches below hold COMPILED ARTEFACTS, and they live on
            # a volume shared with whoever else mounts it. An engine that runs
            # hostile code can poison what another tenant's engine will load and
            # execute. Splitting them into a per-Pod volume closes it and gives
            # back the 9 s. That is the trade; make it deliberately rather than
            # by accident.
            # HOME is NOT the shared volume, and PYTHONNOUSERSITE is set.
            #
            # Python imports `usercustomize` from the user site directory at
            # interpreter startup, and the user site directory is derived from
            # HOME. With HOME on a volume the tenant can write, dropping
            # $HOME/.local/lib/python3.X/site-packages/usercustomize.py is
            # arbitrary code inside this GPU-holding Pod -- picked up by every
            # engine vLLM spawns, without touching argv at all. The flag makes
            # that directory inert; moving HOME means there is nothing there to
            # find in the first place.
            - name: HOME
              value: /pod-home
            - name: PYTHONNOUSERSITE
              value: "1"
            - name: HF_HOME
              value: /model-cache
            - name: VLLM_CACHE_ROOT
              value: /model-cache/vllm
            - name: FLASHINFER_WORKSPACE_DIR
              value: /model-cache/flashinfer
            - name: TRITON_CACHE_DIR
              value: /model-cache/triton
            - name: XDG_CACHE_HOME
              value: /model-cache
            - name: XDG_CONFIG_HOME
              value: /model-cache/config
            # vLLM 0.22+ computes an inductor cache dir at import through
            # getpass.getuser(), which raises KeyError under OpenShift's
            # arbitrary UID because it has no /etc/passwd entry. Seeding USER
            # makes getpass read the environment instead.
            # https://github.com/vllm-project/vllm/issues/44548
            - name: USER
              value: vllm
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              # THE ONE STRUCTURAL DIFFERENCE FROM FMA. Its controller strips
              # this from the launcher Pod (removeGPUResourceLimits) and gives
              # the GPU to a transient requester instead. When that requester
              # goes, the allocation is released while sleeping engines still
              # hold cumem handles into that device -- and another tenant takes
              # it. Measured: two of three unbound sleepers could not be woken
              # at all. The pool keeps its GPUs for as long as it keeps models.
              nvidia.com/gpu: "1"
              # Memory is a limit as well as a request because the warm set is
              # the thing worth protecting: an unbounded Pod that gets evicted
              # loses every resident model at once.
              memory: 128Gi
            requests:
              nvidia.com/gpu: "1"
              # THE MEMORY REQUEST IS THE WARM-SET BUDGET. Measured on an
              # H100: level-1 sleep moves the weights into SHARED memory, and
              # the container's cgroup is charged for all of it --
              #
              #   0.6B   1.1 GiB of weights ->  4.1 GiB charged while asleep
              #   8B    14.9 GiB of weights -> 23.4 GiB charged while asleep
              #
              # i.e. about 2.6 GiB + 1.4x the weights, per resident model. Note
              # ANONYMOUS memory barely moves, so anything watching `anon` will
              # report a sleeper as costing nothing; watch memory.current.
              #
              # Left unset, the scheduler treats a Pod holding sixteen sleeping
              # models as needing no memory at all, and the kubelet evicts it:
              # the one outcome the pool exists to prevent.
              #
              # 128Gi holds FOUR 8B models (4 x 23.4 GiB, with margin), which
              # is the number the break-even works out at: see §2.8 of
              # docs/proposals/fast-model-loading.md. The saving over keeping a
              # spare replica per model is a factor of C, the models held per
              # Pod, so C=1 is not break-even -- it is strictly worse than the
              # spare replica, which holds the same GPU and can actually serve.
              #
              # This was 48Gi, chosen before any of it was measured and against
              # a 0.6B model. For anything anyone would really pool, 48Gi gives
              # C=1 or 2: the regime where the pool loses.
              #
              # A 32B sleeper needs ~86 GiB, so C=1 even here; see
              # config/warmpool-multi-gpu, which raises the GPUs and the memory
              # together.
              memory: 128Gi
              cpu: "2"
          volumeMounts:
            - name: pod-home
              mountPath: /pod-home
            - name: model-cache
              mountPath: /model-cache
          readinessProbe:
            # The supervisor being up says nothing about whether a model is
            # awake -- that is the proxy's /readyz. This probe only reports that
            # the Pod can accept instructions.
            #
            # exec, not httpGet: :8001 is closed to everything but the
            # controller, and a kubelet probe comes from the node, which no
            # NetworkPolicy `from:` selector can name. An httpGet probe here
            # would depend on whether the CNI happens to permit host traffic.
            # Run inside the container, it depends on nothing.
            exec:
              command:
                - python3
                - -c
                - |
                  import sys, urllib.request
                  try:
                      urllib.request.urlopen("http://127.0.0.1:8001/health", timeout=3)
                  except Exception as err:
                      print(err); sys.exit(1)
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            # exec for the same reason as the readiness probe above.
            #
            # A wedged supervisor otherwise holds its GPU indefinitely: nothing
            # else in the system can restart it, and the models it holds are
            # unreachable.
            exec:
              command:
                - python3
                - -c
                - |
                  import sys, urllib.request
                  try:
                      urllib.request.urlopen("http://127.0.0.1:8001/health", timeout=5)
                  except Exception as err:
                      print(err); sys.exit(1)
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
        # The Pod's serving port. Engines bind their own ports for life and a
        # sleeping process keeps its socket, so they cannot take turns binding
        # the port the InferencePool dials. This owns it and follows whichever
        # model is awake; WVA re-points it through the control endpoint.
        - name: proxy
          # NOT SHIPPABLE AS-IS: a personal namespace, pinned by digest so at
          # least the bytes are fixed. Build it from this tree with
          # `make docker-build-warmpool-proxy docker-push-warmpool-proxy
          # WARMPOOL_PROXY_IMG=...` (Dockerfile.warmpool-proxy) and republish
          # under the project's own namespace before this leaves a test cluster.
          image: ghcr.io/ev-shindin/warmpool-proxy:v8@sha256:66e8bb63b985c87db81716b2047f07a5deba2f1729e5397f4476d2415af72093
          imagePullPolicy: IfNotPresent
          args:
            - --port=8000
            - --control-port=8002
            - --v=2
          ports:
            - name: serving
              containerPort: 8000
              protocol: TCP
            - name: proxy-control
              containerPort: 8002
              protocol: TCP
          livenessProbe:
            # exec, through the proxy binary itself: the image is distroless, so
            # there is no curl and no shell, and the binary is the only thing
            # available to make the request with. The request goes to loopback
            # inside this container, so the NetworkPolicy does not apply to it.
            #
            # Deliberately NOT on the serving port. That port is reachable by
            # every Pod in the namespace, and wiring container restarts to it
            # would let a tenant's traffic restart this proxy: with a per-token
            # flush and 500m of CPU, ~30 s of slow responses is enough.
            exec:
              command: ["/warmpool-proxy", "--check=live", "--control-port=8002"]
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            # THIS is what holds the Pod out of its InferencePool while it
            # sleeps: /readyz answers 200 only when a model is awake here.
            #
            # An ordinary probe rather than a readiness GATE that WVA patches --
            # Fast Model Actuation reaches the same conclusion from the other
            # side, never writing Pod status and leaving readiness to the
            # kubelet. So the controller needs no `pods/status` permission, and
            # a Pod whose controller has died still stops taking traffic when
            # its model sleeps.
            #
            # periodSeconds and failureThreshold are load-bearing, not defaults.
            # Deactivate clears the proxy, waits DrainWait, then sleeps the
            # engine -- so the kubelet must notice within that wait. With the
            # defaults (period 5, failureThreshold 3) it takes 5-20 s to mark
            # the Pod NotReady while the engine sleeps at ~2 s, leaving the Pod
            # in its InferencePool with nothing awake behind it: every dispatch
            # 503s for up to 18 s, on EVERY sleep. That is precisely the
            # Ready-but-asleep window this whole design exists to avoid.
            exec:
              command: ["/warmpool-proxy", "--check=ready", "--control-port=8002"]
            initialDelaySeconds: 3
            periodSeconds: 1
            failureThreshold: 1
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
      volumes:
        # A HOME of its own, per Pod. See the PYTHONNOUSERSITE note above: a
        # writable HOME on the SHARED volume is an execution channel into this
        # Pod, and nothing in a home directory needs to outlive it.
        - name: pod-home
          emptyDir: {}
        # PREREQUISITE, not created here: the PVC belongs to whoever owns the
        # models, and the pool mounts it to reuse a cache that is already warm.
        # Applying this directory into a namespace without `model-pvc` leaves
        # the Pod Pending on a missing volume.
        #
        # IT MUST BE ReadWriteMany, and that is what makes the pool scalable at
        # all. Every Pod mounts it, and Pods land on different nodes -- so with
        # an RWO claim the FIRST replica runs and the second is stuck Pending on
        # a multi-attach error, forever. Nothing else in the system reports that
        # as anything other than a pool which never grew.
        #
        # It is also what makes a Pod on a node that has never served a model
        # cheap: the weights are read from shared storage rather than fetched,
        # and the torch.compile cache another Pod populated is already there.
        # Measured on Spectrum Scale, the read costs about the same whether or
        # not that node has served the model before. A node-local volume would
        # be faster still and would give this up entirely -- every new node
        # would start cold.
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-pvc
