apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: wva-modelserver-metrics
  labels:
    app.kubernetes.io/name: workload-variant-autoscaler
    app.kubernetes.io/component: modelserver-metrics
spec:
  selector:
    matchExpressions:
      # The serving roles, and only those: a pod that holds an engine and serves.
      # The FMA `requester` role is deliberately excluded — it holds no engine, and
      # its launchers are scraped by config/fma-launcher-metrics instead.
      - key: llm-d.ai/role
        operator: In
        values: [decode, prefill]
  podMetricsEndpoints:
      # `modelserver` is the port name llm-d's own base gives the vLLM container
      # (guides/recipes/modelserver/base/single-host/default), and a PodMonitor
      # that names a port no container declares generates NO TARGET AT ALL — not a
      # failing one. That is silent, so the installer verifies series actually
      # arrive rather than trusting this (wva_report_modelserver_metrics, and the
      # post-install log check in deploy/lib/verify.sh).
      #
      # A namespace whose guide names the port differently needs its own
      # PodMonitor; the check will say so rather than leaving it to be discovered
      # from an empty dashboard.
    - port: modelserver
      path: /metrics
      # 10s, to match the pool's PodMonitor: the scale-up signal is a queue at
      # the engine and moves only when Prometheus holds a sample showing it,
      # so the interval is jitter on every decision. Measured: decision lags
      # 25/56/56/87s at 30s, 15/60/60/76s at 10s.
      interval: 10s
