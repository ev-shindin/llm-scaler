---
# The controller's permissions as a NAMESPACED Role.
#
# This is manager-clusterrole.yaml with the cluster-scoped resources removed, and
# what remains is almost all of it — because almost everything WVA reads is
# namespaced. Only three rules could not come along:
#
#   nodes, nodes/status   physical GPU discovery. Needed ONLY by the
#                         gpu-inventory limiter, so an install without one does
#                         not miss them. This is why tenant mode requires
#                         WVA_LIMITER=none or quota.
#   namespaces            listing namespaces to find namespace-local config, and
#                         reading a policy annotation. Both are best-effort: a
#                         single-namespace controller never lists, and the policy
#                         read tolerates being denied.
#   clusterqueues,        Kueue quotas. Needed ONLY by a quota entry with
#   resourceflavors       `kueue.enabled`; components/kueue-reader grants them,
#                         applied by the prereqs phase like node-reader. The
#                         namespaced half, localqueues, is below.
#
# Everything else — pods, services, configmaps, deployments, replicasets,
# statefulsets, deployments/scale, inferencepools, scaledobjects,
# leaderworkersets, servicemonitors, events — is namespaced and works identically
# through a Role. The grant is read-only apart from Events and Pods: KEDA
# performs the scaling actuation, so WVA writes nothing to reach a replica
# count, but lending a warm Pod is WVA's own action and needs patch on pods.
#
# This file is maintained BY HAND while manager-clusterrole.yaml is GENERATED
# from kubebuilder markers, so it does not move when the controller gains a
# permission. It already failed to: pods gained patch for the warm pool and this
# copy did not, which disabled the pool on every namespace-scoped install.
# hack/check-tenant-role.py now fails when the two diverge.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - services
  verbs:
  - get
  - list
  - watch
# Pods are the one exception to the read-only grant above, and the exception is
# the warm pool: lending a Pod means patching it into a model's InferencePool
# and taking it back out. Without `patch` the controller starts, sees it could
# never complete a borrow, and disables the pool -- correctly, but after the
# pool has been created and is already holding its accelerators.
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - ""
  resources:
  - configmaps/status
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  - statefulsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments/scale
  verbs:
  - get
- apiGroups:
  - inference.networking.k8s.io
  - inference.networking.x-k8s.io
  resources:
  - inferencepools
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - keda.sh
  resources:
  - scaledobjects
  verbs:
  - get
- apiGroups:
  - kueue.x-k8s.io
  resources:
  - localqueues
  verbs:
  - get
  - list
- apiGroups:
  - leaderworkerset.x-k8s.io
  resources:
  - leaderworkersets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - leaderworkerset.x-k8s.io
  resources:
  - leaderworkersets/scale
  verbs:
  - get
- apiGroups:
  - monitoring.coreos.com
  resources:
  - servicemonitors
  verbs:
  - get
  - list
  - watch
