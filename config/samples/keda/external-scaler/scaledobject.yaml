# External-scaler WVA discovery — no VariantAutoscaling CRD, no prometheus-adapter.
#
# WVA computes the desired replicas with its capacity model. Instead of publishing
# a metric for KEDA to read (see ../annotations/scaledobject.yaml), WVA implements
# KEDA's external-scaler gRPC contract and returns the decision directly. KEDA/HPA
# actuate.
#
# Discovery is the call itself: KEDA naming this scaler in a trigger is what makes
# the workload WVA's to manage, and the trigger `metadata` below is the whole
# per-variant configuration surface. There are no llm-d.ai/* annotations — WVA no
# longer looks for the workloads it manages, so there is nothing for an opt-in
# annotation to opt into (docs/plans/engine/keda-driven-discovery.md).
#
# Requires the external-scaler Service that routes to the WVA controller's
# gRPC port (config/base/manager/external-scaler-service.yaml). With the deploy
# overlay's namePrefix (wva-) it resolves to
#   wva-external-scaler.workload-variant-autoscaler-system.svc:9090
#
# The trigger is `external-push`, so KEDA holds a StreamIsActive stream open and
# WVA pushes activation the moment a decision lands. That is what makes
# scale-from-zero react in ~the detection interval instead of waiting up to
# pollingInterval: with minReplicaCount: 0, a workload parked at zero is woken by
# the push, not by the next poll. A `type: external` trigger also works — KEDA
# then polls IsActive instead — but scale-from-zero is correspondingly slower.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: sample-deployment-scaler
  namespace: llm-d-sim
  labels:
    app: sample-deployment
    scaler: keda-llm-scaling-manager
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sample-deployment
  pollingInterval: 5
  # KEDA's own timers, and they are NOT the whole story. cooldownPeriod runs only
  # AFTER WVA has already decided to park, because the external scaler reports the
  # trigger active until then — so the time from the last request to zero is
  # scaleToZero.retentionPeriod (WVA, default 10m) PLUS this, in sequence.
  #
  # Both gate the DEACTIVATION step only -- the drop to minReplicaCount once the
  # trigger reports inactive. An ordinary scale-down while active goes through the
  # HPA and is not held by either. initialCooldownPeriod is measured from
  # ScaledObject creation and consulted only while a trigger has never once been
  # active, so it does nothing for an adopted object, whose creationTimestamp is
  # older than the adoption.
  cooldownPeriod: 30
  initialCooldownPeriod: 30
  # Park the workload at zero when WVA decides it needs no replicas; activation
  # arrives over the push stream.
  minReplicaCount: 0
  maxReplicaCount: 10
  fallback:
    failureThreshold: 3
    replicas: 2
    behavior: "currentReplicasIfHigher"
  advanced:
    restoreToOriginalReplicaCount: false
    horizontalPodAutoscalerConfig:
      name: wva-keda-hpa-sample-deployment
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 0
          policies:
          - type: Percent
            value: 100
            periodSeconds: 30
          - type: Pods
            value: 5
            periodSeconds: 15
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
          - type: Percent
            value: 100
            periodSeconds: 30
          - type: Pods
            value: 5
            periodSeconds: 15
  triggers:
  - type: external-push
    name: wva-external-scaler
    metadata:
      # The WVA controller's external-scaler gRPC service (host:port).
      scalerAddress: wva-external-scaler.workload-variant-autoscaler-system.svc.cluster.local:9090
      # The model this variant serves. Required: it is the grouping key for every
      # multi-variant decision.
      modelID: default/default
      # Per-replica cost for cost-aware optimization. Optional; defaults to "10.0".
      variantCost: "10.0"
      # The scale target is NOT set here. It is read from this ScaledObject's own
      # spec.scaleTargetRef, so the two cannot disagree.
