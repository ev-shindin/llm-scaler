apiVersion: apps/v1
kind: Deployment
metadata:
  name: wva-warm-pool
  labels:
    app.kubernetes.io/name: workload-variant-autoscaler
    app.kubernetes.io/component: warm-pool
spec:
  # K: how many models the pool can have AWAKE at once, one per Pod. Start at 1
  # and size it from measurement -- the loss model in
  # docs/proposals/fast-model-loading.md turns spike rate and hold time into K,
  # and neither has been measured on a fleet with organic traffic.
  replicas: 1
  # Recreate, not RollingUpdate: a surge needs a SECOND GPU before the old Pod
  # releases its own, so on a node with one free GPU the default strategy
  # deadlocks -- the new Pod Pending, the old one never terminated.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: workload-variant-autoscaler
      app.kubernetes.io/component: warm-pool
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workload-variant-autoscaler
        app.kubernetes.io/component: warm-pool
        # Membership in a model's InferencePool is added and removed by WVA at
        # wake and sleep. Nothing here claims a model: an idle pool Pod belongs
        # to no InferencePool and receives no traffic.
    spec:
      # Nothing in this Pod talks to the Kubernetes API. The supervisor's only
      # API use is a ConfigMap read reached exclusively in --mock-gpus mode
      # (gputranslator.py: `if self.mock_mode and ...`), which this Pod never
      # enables -- so it needs no token, and the container that runs model code
      # should not be handed one.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # GPU nodes are routinely tainted. Without this the Deployment sits
      # Pending on exactly the clusters it is meant for.
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      # CLUSTER-SPECIFIC. Needed where the GPU operator installs a RuntimeClass
      # (pokprod uses `nvidia-legacy`); on a cluster without it, admission fails
      # outright, so remove this line rather than guess at a name.
      runtimeClassName: nvidia-legacy
      containers:
        - name: inference-server
          # The launcher published by Fast Model Actuation: it spawns and
          # supervises vLLM engines inside this container. Copied into
          # warmpool/supervisor/ so the source is readable here; the image is
          # theirs because it is the one proven on this cluster.
          image: ghcr.io/llm-d-incubation/llm-d-fast-model-actuation/launcher:v0.6.0-alpha.13
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              exec python3 /app/launcher.py \
              --host 0.0.0.0 \
              --log-level info \
              --port=8001
          ports:
            - name: supervisor
              containerPort: 8001
              protocol: TCP
          env:
            # Every cache under the shared PVC, so a model loaded once is loaded
            # for every Pod: measured on this cluster, a 1.5 GB weight read takes
            # ~2.8 s whether or not this node has served the model before, and
            # the shared torch.compile cache cuts compilation from 12.35 s to
            # 3.08 s.
            - name: HOME
              value: /model-cache
            - name: HF_HOME
              value: /model-cache
            - name: VLLM_CACHE_ROOT
              value: /model-cache/vllm
            - name: FLASHINFER_WORKSPACE_DIR
              value: /model-cache/flashinfer
            - name: TRITON_CACHE_DIR
              value: /model-cache/triton
            - name: XDG_CACHE_HOME
              value: /model-cache
            - name: XDG_CONFIG_HOME
              value: /model-cache/config
            # vLLM 0.22+ computes an inductor cache dir at import through
            # getpass.getuser(), which raises KeyError under OpenShift's
            # arbitrary UID because it has no /etc/passwd entry. Seeding USER
            # makes getpass read the environment instead.
            # https://github.com/vllm-project/vllm/issues/44548
            - name: USER
              value: vllm
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              # THE ONE STRUCTURAL DIFFERENCE FROM FMA. Its controller strips
              # this from the launcher Pod (removeGPUResourceLimits) and gives
              # the GPU to a transient requester instead. When that requester
              # goes, the allocation is released while sleeping engines still
              # hold cumem handles into that device -- and another tenant takes
              # it. Measured: two of three unbound sleepers could not be woken
              # at all. The pool keeps its GPUs for as long as it keeps models.
              nvidia.com/gpu: "1"
              # Memory is a limit as well as a request because the warm set is
              # the thing worth protecting: an unbounded Pod that gets evicted
              # loses every resident model at once.
              memory: 48Gi
            requests:
              nvidia.com/gpu: "1"
              # THE MEMORY REQUEST IS THE WARM-SET BUDGET, and must be sized as
              # (models held per Pod) x (weight size), because a level-1 sleeper
              # keeps its weights in HOST memory -- only ~1.4 GiB stays on the
              # GPU. Left unset, the scheduler treats a Pod holding sixteen
              # sleeping models as needing no memory at all, and the kubelet
              # evicts it: the one outcome the pool exists to prevent.
              #
              # 48Gi suits a handful of small models. Raise it before raising
              # the warm set.
              memory: 48Gi
              cpu: "2"
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
          readinessProbe:
            # The supervisor being up says nothing about whether a model is
            # awake -- that is the proxy's /readyz. This probe only reports that
            # the Pod can accept instructions.
            httpGet:
              path: /health
              port: supervisor
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            # A wedged supervisor otherwise holds its GPU indefinitely: nothing
            # else in the system can restart it, and the models it holds are
            # unreachable.
            httpGet:
              path: /health
              port: supervisor
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
        # The Pod's serving port. Engines bind their own ports for life and a
        # sleeping process keeps its socket, so they cannot take turns binding
        # the port the InferencePool dials. This owns it and follows whichever
        # model is awake; WVA re-points it through the control endpoint.
        - name: proxy
          # NOT SHIPPABLE AS-IS: a personal namespace, pinned by digest so at
          # least the bytes are fixed. Build it from this tree with
          # `make docker-build-warmpool-proxy docker-push-warmpool-proxy
          # WARMPOOL_PROXY_IMG=...` (Dockerfile.warmpool-proxy) and republish
          # under the project's own namespace before this leaves a test cluster.
          image: ghcr.io/ev-shindin/warmpool-proxy:v4@sha256:0fee87f20324f3be676a15719fb1dbd151ed39b3dae602b93901532b3b598dc8
          imagePullPolicy: IfNotPresent
          args:
            - --port=8000
            - --control-port=8002
            - --v=2
          ports:
            - name: serving
              containerPort: 8000
              protocol: TCP
            - name: proxy-control
              containerPort: 8002
              protocol: TCP
          livenessProbe:
            # On the SERVING port, not the control port. Two reasons: a kubelet
            # probe comes from the node and the NetworkPolicy restricts the
            # control port to the controller, and a probe on a port other than
            # the one traffic uses can pass while that port is wedged.
            httpGet:
              path: /healthz
              port: serving
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            # THIS is what holds the Pod out of its InferencePool while it
            # sleeps: /readyz answers 200 only when a model is awake here.
            #
            # An ordinary probe rather than a readiness GATE that WVA patches --
            # Fast Model Actuation reaches the same conclusion from the other
            # side, never writing Pod status and leaving readiness to the
            # kubelet. So the controller needs no `pods/status` permission, and
            # a Pod whose controller has died still stops taking traffic when
            # its model sleeps.
            httpGet:
              path: /readyz
              port: serving
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
      volumes:
        # PREREQUISITE, not created here: the PVC belongs to whoever owns the
        # models, and the pool mounts it to reuse a cache that is already warm.
        # Applying this directory into a namespace without `model-pvc` leaves
        # the Pod Pending on a missing volume.
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-pvc
