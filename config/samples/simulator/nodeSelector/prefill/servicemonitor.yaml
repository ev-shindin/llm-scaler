apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dev-model-prefill-monitor
  namespace: workload-variant-autoscaler-monitoring
  labels:
    app: dev-model-prefill
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: dev-model-prefill
  namespaceSelector:
    matchNames:
      - llm-d-sim
  endpoints:
    - port: http
      path: /metrics
      interval: 10s
