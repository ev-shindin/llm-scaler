# TWO-VARIANT WVA SCENARIO (Topology B — one shared EPP)
#
# Deploys the primary variant (cost 10.0) of unsloth/Meta-Llama-3.1-8B-Instruct as a
# standard single-stack benchmark. A second variant at a lower cost (default
# 5.0) is then layered on top via `make benchmark-add-variant`.
#
# Both variants register their pods into the SAME InferencePool / EPP so the
# WVA saturation solver can compare their costs under a unified queue-depth
# signal and scale the more efficient variant first.
#
# Topology:
#
#         +--------- Gateway -------------------------+
#         |  HTTPRoute → InferencePool (one EPP)      |
#         +--------------------------------------------+
#                              |
#               +--------------+--------------+
#               |                             |
#     +---------+--------+       +------------+-----+
#     | vLLM decode      |       | vLLM decode      |
#     | primary (cost 10)|       | secondary (cost 5)|
#     | ScaledObject     |       | ScaledObject     |
#     +------------------+       +------------------+
#                   ^                       ^
#                   +--- KEDA --- WVA (1) --+
#                                external scaler
#
# WVA is NOT installed by this scenario
# -------------------------------------
# It used to be: this file carried a `wva:` block that had llm-d-benchmark
# install the published Helm chart at v0.8.0-rc5. That chart was deleted from
# this repo, so every run measured a released binary pulled from a registry
# rather than the code under test. `make benchmark-standup` now installs WVA
# from this repo's deploy/ into the benchmark namespace at namespace scope, and
# creates one ScaledObject per model server.
#
# The ScaledObject is not decoration, it is the REGISTRATION: WVA has no watch
# and no listing, and learns which workloads it manages from the KEDA calls its
# triggers cause. Identity rides in the trigger metadata — `modelID` groups the
# two variants, `variantCost` prices them (omitted = 10.0, which is the
# primary's price here).
#
# How the two variants share one InferencePool
# --------------------------------------------
# The InferencePool EPP selects pods by two labels:
#   llm-d.ai/inferenceServing: "true"          (camelCase)
#   llm-d.ai/model:            <model-hash>
#
# The primary Deployment (managed by modelservice chart) also sets a third
# label on its pods: llm-d.ai/inference-serving: "true" (kebab-case), which
# is the primary's own selector discriminator.
#
# The secondary Deployment created by `benchmark-add-variant` intentionally
# OMITS the kebab label but KEEPS the camelCase + model-hash labels, so:
#   - The InferencePool picks up both Deployments' pods (two labels match).
#   - The primary Deployment does not accidentally claim secondary pods
#     (primary selector requires the kebab label, which secondary pods lack).
#   - The secondary Deployment uses wva.llmd.ai/variant=v2 as a unique
#     discriminator in its own pod selector.
#
# Both ScaledObjects carry modelID = "unsloth/Meta-Llama-3.1-8B-Instruct" so the
# WVA solver groups them and applies cost-weighted scaling.
#
# Running (two-step workflow):
#
#   # Step 1: stand up the primary variant (cost 10.0) and install WVA.
#   # IMG decides WHAT IS MEASURED — without it you benchmark the published
#   # :latest, not your build.
#   make benchmark-standup BENCHMARK_NAMESPACE=<ns> BENCHMARK_SPEC=guides/two-variant-wva \
#        IMG=<your build> ENVIRONMENT=openshift
#
#   # Step 2: add secondary variant (cost 5.0, default)
#   make benchmark-add-variant BENCHMARK_NAMESPACE=<ns>
#
#   # Optional: a different cost/suffix/shape — all of it lives in the variant
#   # config, so point at another one:
#   make benchmark-add-variant BENCHMARK_NAMESPACE=<ns> \
#        VARIANT_CONFIG=hack/benchmark/scenarios/guides/variants/<name>.yaml
#
#   # Run the benchmark (both variants are in the same pool)
#   make benchmark-run BENCHMARK_NAMESPACE=<ns>
#
#   # Teardown (removes all resources including secondary)
#   make benchmark-teardown BENCHMARK_NAMESPACE=<ns>

# ============================================================================
# SHARED — applied to the stack before per-stack overrides
# ============================================================================
shared:
  # --------------------------------------------------------------------------
  # DEPLOYMENT METHOD
  # --------------------------------------------------------------------------
  modelservice:
    enabled: true
    # EPP PLUGIN CONFIG — the flowControl feature gate, which is what gives WVA
    # its queue-depth signal.
    #
    # It has to live HERE, under modelservice.router.epp, because that is where
    # the chart reads it. It used to sit at a top-level `inferenceExtension:`
    # key, which the chart neither reads nor rejects: the block was silently
    # dropped, the EPP came up on the chart's own default-plugins.yaml with no
    # featureGates block at all, and `make deploy-wva` then refused to install --
    #
    #   Refusing to continue — fix the EPP above, or SKIP_CHECKS=true
    #
    # which reads as a misconfigured cluster rather than as a scenario whose EPP
    # config never arrived. workload-autoscaling.yaml always had it in the right
    # place; this file was the odd one out, so the difference was invisible
    # until both were run.
    #
    # The apiVersion is llm-d.ai/v1alpha1 — the one the working scenario uses
    # and the one the deployed EPP reports.
    router:
      epp:
        pluginsConfigFile: "wva-plugins.yaml"
        pluginsCustomConfig:
          wva-plugins.yaml: |
            apiVersion: llm-d.ai/v1alpha1
            kind: EndpointPickerConfig
            featureGates:
              - flowControl
            plugins:
              - type: queue-scorer
              - type: kv-cache-utilization-scorer
              - type: prefix-cache-scorer
            schedulingProfiles:
              - name: default
                plugins:
                  - pluginRef: queue-scorer
                    weight: 2
                  - pluginRef: kv-cache-utilization-scorer
                    weight: 2
                  - pluginRef: prefix-cache-scorer
                    weight: 3
  standalone:
    enabled: false

  # --------------------------------------------------------------------------
  # WVA CONTROLLER — deliberately NOT installed here.
  #
  # llm-d-benchmark would install the published Helm chart, which is a released
  # binary and not the code in this repo (the chart was deleted from it). The
  # standup target installs WVA from deploy/ afterwards instead; see the header.
  # Set BENCHMARK_WVA_DEPLOY=false to run this scenario with no autoscaler at all.
  #
  # No prometheus-adapter either, and not merely because it is unused: it and
  # KEDA both register the external.metrics.k8s.io APIService, of which a cluster
  # has exactly one. Installing it alongside KEDA takes the group away from the
  # metrics server every ScaledObject's HPA queries. It existed here for the HPA
  # path, which the KEDA external scaler replaced.
  # --------------------------------------------------------------------------
  wva:
    enabled: false

  # --------------------------------------------------------------------------
  # IMAGE OVERRIDES — pin vllm-openai to v0.14.0 (newer than the v0.9.2
  # default) so the model server emits vllm:cache_config_info, allowing the
  # WVA saturation-V2 analyzer to use real KV-memory capacity instead of
  # the per-step batch budget fallback.
  # --------------------------------------------------------------------------
  images:
    vllmOpenai:
      repository: docker.io/vllm/vllm-openai
      tag: v0.14.0

  # --------------------------------------------------------------------------
  # VLLM COMMON
  # --------------------------------------------------------------------------
  vllmCommon:
    kvTransfer:
      enabled: true
      connector: NixlConnector
      role: kv_both
    flags:
      enforceEager: true
      disableLogRequests: true
      disableUvicornAccessLog: true
      allowLongMaxModelLen: "1"
      serverDevMode: "1"
    volumes:
      - name: shared-config
        type: emptyDir
        emptyDir: {}
      - name: dshm
        type: emptyDir
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
    volumeMounts:
      - name: dshm
        mountPath: /dev/shm
      - name: shared-config
        mountPath: /shared-config

  # --------------------------------------------------------------------------
  # PREFILL / DECODE defaults
  # --------------------------------------------------------------------------
  prefill:
    enabled: false
    replicas: 0

  decode:
    initContainers:
      - name: preprocess
        imageKey: benchmark
        imagePullPolicy: Always
        # The generator (from the benchmark image, so not patchable in the clone)
        # starts the script it writes with two apt-get installs: iproute2 for the
        # `ip route/rule` lines it emits on a multi-NIC RDMA node, infiniband-diags
        # for nothing the serving container ever runs. On a single-NIC node the
        # script has no ip commands and both installs are dead weight: 71 s of a
        # 186 s order-to-Ready measured on a decode pod that already had the image,
        # and the only part that varied run to run (mirror speed). The autoscaler
        # sizes its first ramp by the queue one replica builds while the second
        # starts, so those 71 s were six over-ordered replicas. The install of
        # iproute2 stays whenever the script needs it.
        command:
          - /bin/sh
          - -c
          - |
            set_llmdbench_environment.py -e /shared-config/llmdbench_env.sh -i || exit $?
            f=/shared-config/llmdbench_env.sh
            sed -i '/^which ibstat$/,/^fi$/d' "$f"
            if ! grep -qE '^ip (route|rule) ' "$f"; then
              sed -i '/^which ip$/,/^fi$/d' "$f"
            fi
            grep -c apt-get "$f" | sed 's/^/preprocess: apt-get lines left in llmdbench_env.sh: /'
            # The engine sources this script before it starts, so the guard below runs
            # where the cache mount is. A cache dir that is not writable (a CSI
            # publish that came back read-only after a retry, seen once on kermit)
            # must cost a compile, not the replica: vLLM fails hard on os.makedirs.
            echo >> "$f"  # the generator leaves no trailing newline
            cat >> "$f" <<'EOF'
            for v in VLLM_CACHE_ROOT FLASHINFER_WORKSPACE_DIR TRITON_CACHE_DIR; do
              # neither a doubled dollar nor a dollar-paren in here: Kubernetes rewrites both in a container command
              eval "d=\${$v}"
              [ -n "$d" ] || continue
              if ! mkdir -p "$d" 2>/dev/null || ! touch "$d/.writable" 2>/dev/null; then
                echo "engine cache $v=$d is not writable; using the engine default instead"
                unset $v
              fi
            done
            EOF
        volumeMounts:
          - name: shared-config
            mountPath: /shared-config
    parallelism:
      tensor: 2
      data: 1
      dataLocal: 1
      workers: 1
    extraEnvVars:
      # vLLM writes its torch.compile artefacts, the FlashInfer autotune
      # table and Triton's JIT cache under /tmp inside the container, so
      # every replica recompiles from nothing: 14 s of torch.compile on a
      # 0.6B model, measured, more on a large one. /engine-cache is a subPath
      # of the harness's workload PVC (RWX, read-write; the model claim is
      # mounted read-only and a CSI driver publishes a claim once per pod, so
      # a second mount of it inherits read-only) -- see additionalVolumes --
      # so a replica after the first finds the caches warm. vLLM keys them by
      # a hash of the engine config: a change of model, flags or version
      # is a miss, never a stale hit.
      - name: VLLM_CACHE_ROOT
        value: /engine-cache/vllm
      - name: FLASHINFER_WORKSPACE_DIR
        value: /engine-cache/flashinfer
      - name: TRITON_CACHE_DIR
        value: /engine-cache/triton
    extraContainerConfig:
      ports:
        - containerPort: 5557
          protocol: TCP
        - containerPort: 8200
          name: metrics
          protocol: TCP
      securityContext:
        capabilities:
          add:
            - "IPC_LOCK"
            - "SYS_RAWIO"
        runAsGroup: 0
        runAsUser: 0
      imagePullPolicy: Always
    additionalVolumeMounts:
      # Read-write home for the engine caches (VLLM_CACHE_ROOT and friends
      # above): the harness's workload PVC, which its results pod already
      # mounts read-write. The model claim is mounted read-only.
      - name: engine-cache
        mountPath: /engine-cache
        subPath: engine-cache
    additionalVolumes:
      - name: engine-cache
        type: persistentVolumeClaim
        persistentVolumeClaim:
          claimName: workload-pvc
    probes:
      startup:
        path: /v1/models
        # 0/5/360, not 15/30/60: a 30 s period reports an engine Ready up to
        # 30 s after it is, and the autoscaler's first ramp charges every one
        # of those seconds as queue. Same 30-minute budget.
        failureThreshold: 360
        initialDelaySeconds: 0
        periodSeconds: 5
        timeoutSeconds: 5
      liveness:
        path: /health
        failureThreshold: 3
        periodSeconds: 10
        timeoutSeconds: 5
      readiness:
        path: /v1/models
        failureThreshold: 3
        periodSeconds: 5
        timeoutSeconds: 2
    monitoring:
      podmonitor:
        enabled: true
        portName: metrics
        path: /metrics
        interval: 30s
        labels:
          release: llmd

  workDir: "~/data/two-variant-wva"
  harness:
    name: inference-perf
    experimentProfile: shared_prefix_synthetic.yaml

  storage:
    modelPvc:
      size: 32Gi
      # ReadWriteMany, explicitly: a default RWO class binds the cache to one
      # node, and the second decode replica then never schedules. See the same
      # note in workload-autoscaling.yaml.
      accessModes:
        - ReadWriteMany


# ============================================================================
# SCENARIO — primary variant (high-cost, cost 10.0)
#
# This standup deploys the primary variant only. Run `make benchmark-add-variant`
# afterwards to add the secondary variant at a lower cost.
# ============================================================================
scenario:
  - name: "llama-8b"

    # Default model is an INSTRUCT (chat-templated) model. On llm-d-benchmark
    # >= v0.7.0 the decode image ships transformers >= 4.44, which rejects a
    # model whose tokenizer defines no chat template (i.e. base models) with
    # ChatTemplateResolutionError. Override with -m / BENCHMARK_MODEL_ID, but
    # only with another chat-templated model (or supply --chat-template).
    model:
      name: unsloth/Meta-Llama-3.1-8B-Instruct
      shortName: unsloth-meta-llama-3-1-8b-instruct
      path: models/unsloth/Meta-Llama-3.1-8B-Instruct
      huggingfaceId: unsloth/Meta-Llama-3.1-8B-Instruct
      size: 32Gi
      maxModelLen: 8192
      blockSize: 64
      gpuMemoryUtilization: 0.85

    # No wva: block. The primary's ScaledObject is created by benchmark-standup
    # (deploy/lib/scaledobject.sh), bounded by BENCHMARK_KEDA_MIN_REPLICAS /
    # BENCHMARK_KEDA_MAX_REPLICAS, at the default variantCost of 10.0.

    decode:
      replicas: 1
      resources:
        limits:
          memory: 48Gi
          cpu: "16"
        requests:
          memory: 48Gi
          cpu: "16"
