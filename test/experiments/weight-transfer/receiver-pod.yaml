apiVersion: v1
kind: Pod
metadata: { name: xfer, namespace: CHANGE-ME, labels: { app: xfer } }
spec:
  restartPolicy: Never
  containers:
    - name: vllm
      image: vllm/vllm-openai:v0.26.0
      env:
        - { name: USER, value: vllm }
        - { name: HOME, value: /tmp }
        - { name: VLLM_SERVER_DEV_MODE, value: "1" }
      command: ["/bin/bash","-lc"]
      args:
        - |
          export CUDA_VISIBLE_DEVICES=0
          exec vllm serve /model-cache/models/Qwen/Qwen3-0.6B \
            --served-model-name Qwen/Qwen3-0.6B \
            --host 0.0.0.0 --port 8000 \
            --max-model-len 2048 --enforce-eager \
            --gpu-memory-utilization 0.25 \
            --enable-sleep-mode \
            --weight-transfer-config '{"backend":"nccl"}'
      ports: [{ containerPort: 8000 }]
      resources:
        limits: { nvidia.com/gpu: "2", memory: 64Gi, cpu: "12" }
        requests: { nvidia.com/gpu: "2", memory: 64Gi, cpu: "6" }
      volumeMounts:
        - { name: model-storage, mountPath: /model-cache }
        - { name: dshm, mountPath: /dev/shm }
        - { name: scripts, mountPath: /scripts }
  volumes:
    - { name: model-storage, persistentVolumeClaim: { claimName: model-pvc } }
    - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 16Gi } }
    - { name: scripts, emptyDir: {} }
